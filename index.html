  a{ -webkit-tap-highlight-color:transparent; }

  .page{
    position:relative;
    min-height:100vh;
    min-height:100svh;
    width:100%;
    display:flex;
    flex-direction:column;
    padding:34px clamp(20px,4.5vw,72px) 32px;
    background:
      radial-gradient(120% 90% at 12% 0%, #ECFBF6 0%, rgba(236,251,246,0) 55%),
      radial-gradient(110% 80% at 92% 100%, #E6F7F4 0%, rgba(230,247,244,0) 50%),
      #FBF8F1;
    overflow:hidden;
  }
  .blob{ position:absolute; border-radius:50%; pointer-events:none; }
  .blob-tr{ top:-90px; right:-60px; width:340px; height:340px;
    background:radial-gradient(circle at 40% 35%, rgba(45,212,191,.18), rgba(45,212,191,0) 70%); }
  .blob-bl{ bottom:-110px; left:-70px; width:360px; height:360px;
    background:radial-gradient(circle at 50% 50%, rgba(244,98,58,.10), rgba(244,98,58,0) 70%); }

  /* ===== HEADER ===== */
  header{
    position:relative; z-index:2;
    display:flex; align-items:center; gap:16px; min-height:60px;
  }
  .logo{ flex:none; width:96px; height:96px; border-radius:50%;
    filter:drop-shadow(0 6px 16px rgba(14,158,148,.22)); }
  nav{
    flex:1; display:flex; align-items:center; gap:10px;
    flex-wrap:wrap; justify-content:center;
  }
  .nav-spacer{ flex:none; width:96px; }
  .tab{
    display:inline-flex; align-items:center;
    padding:12px 20px; border-radius:999px;
    background:#FFFFFF; border:1.5px solid #E4EBE9;
    color:#26343B; font-size:15.5px; font-weight:600;
    font-family:inherit; text-decoration:none; white-space:nowrap;
    box-shadow:0 2px 5px rgba(30,42,50,.05);
    transition:all .18s ease;
  }
  .tab:hover, .tab:focus-visible{
    background:#0E9E94; border-color:#0E9E94; color:#FFFFFF;
    transform:translateY(-2px); box-shadow:0 10px 22px rgba(14,158,148,.30);
    outline:none;
  }

  /* ===== nav menu button (opens a modal) ===== */
  button.tab{ appearance:none; cursor:pointer; }
  .tab .caret{ font-size:11px; margin-left:4px; color:#8A9AA0; }
  .tab:hover .caret, .tab:focus-visible .caret{ color:#FFFFFF; }

  /* ===== nav choice modal ===== */
  .menu-modal{
    position:fixed; inset:0; z-index:50; display:none;
    align-items:center; justify-content:center; padding:24px;
    background:rgba(20,32,38,.42); backdrop-filter:blur(2px);
  }
  .menu-modal.is-open{ display:flex; }
  .menu-modal-card{
    position:relative; width:min(460px,100%);
    background:#FBF8F1; border-radius:22px; padding:30px 28px 26px;
    box-shadow:0 30px 70px rgba(14,30,28,.32); animation:menu-pop .18s ease;
  }
  @keyframes menu-pop{ from{ transform:translateY(8px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
  .menu-modal-close{
    position:absolute; top:16px; right:16px; width:34px; height:34px; border-radius:50%;
    background:#FFFFFF; border:1px solid #E4EBE9; cursor:pointer;
    font-size:18px; line-height:1; color:#5A6B72;
    display:flex; align-items:center; justify-content:center; transition:all .15s ease;
  }
  .menu-modal-close:hover{ background:#0E9E94; color:#FFF; border-color:#0E9E94; }
  .menu-modal-eyebrow{ margin:0 0 6px; font-size:13px; font-weight:700; letter-spacing:.06em;
    text-transform:uppercase; color:#0E9E94; }
  .menu-modal-title{ margin:0 0 20px; font-family:'Sora',sans-serif; font-weight:800;
    font-size:23px; letter-spacing:-.02em; color:#1E2A32; }
  .menu-modal-list{ display:flex; flex-direction:column; gap:12px; }
  .menu-choice{
    display:flex; align-items:center; gap:12px; padding:17px 20px; border-radius:16px;
    background:#FFFFFF; border:1.5px solid #BfeAe3; color:#1E2A32; text-decoration:none;
    box-shadow:0 4px 12px rgba(14,158,148,.10);
    transition:transform .16s ease, box-shadow .16s ease;
  }
  .menu-choice:hover, .menu-choice:focus-visible{
    transform:translateY(-2px); box-shadow:0 12px 24px rgba(14,158,148,.22); outline:none;
  }
  .menu-choice .mc-name{ font-size:16.5px; font-weight:700; }
  .menu-choice .mc-note{ font-size:13px; font-weight:600; color:#9AA7AC; }
  .menu-choice .mc-go{ margin-left:auto; font-size:19px; font-weight:700; color:#0E9E94; }
  .menu-choice.soon{
    background:rgba(255,255,255,.55); border:1.5px dashed #D3DEDB;
    box-shadow:none; cursor:default;
  }
  .menu-choice.soon .mc-name{ color:#9AA7AC; }
  .menu-choice.soon .mc-note{ color:#F4623A; }
  .soon-note{ font-size:11px; font-weight:700; color:#F4623A; }

  /* 준비중(비활성) 상단 탭 */
  .tab-soon, .tab-soon:hover, .tab-soon:focus-visible{
    background:rgba(255,255,255,.55); border:1.5px dashed #D3DEDB; color:#9AA7AC;
    box-shadow:none; transform:none; cursor:default; gap:7px;
  }

  /* ===== HERO ===== */
  main{
    position:relative; z-index:2; flex:1;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:clamp(10px,1.6vh,22px); text-align:center; min-height:0;
  }
  .mascots{ position:relative; }
  .mascots{ animation:lab-float 6s ease-in-out infinite; }
  .mascots .glow{
    position:absolute; left:50%; top:54%; transform:translate(-50%,-50%);
    width:clamp(180px,30vh,290px); height:clamp(180px,30vh,290px); border-radius:50%;
    background:radial-gradient(circle at 50% 50%, rgba(45,212,191,.26), rgba(45,212,191,0) 68%);
    filter:blur(6px);
  }
  .mascot-row{
    position:relative; display:flex; align-items:flex-end; justify-content:center;
  }
  .mascot-row img{ width:auto; filter:drop-shadow(0 16px 22px rgba(14,158,148,.20)); }
  .m-wave{ height:clamp(150px,26vh,250px); display:block; }

  /* ===== 등장 애니메이션: 토끼가 화면 오른쪽 밖에서 뛰어와 가운데에서 변신 ===== */
  /* --mascot-h = 변신 후 토끼의 키. 무대 높이는 원본 장면(425px)과 토끼 키(292px)의 비율로 정함 */
  .intro-stage{
    --mascot-h:clamp(150px,26vh,250px);
    position:relative; width:100%; height:calc(var(--mascot-h) * 425 / 292);
    margin:calc(var(--mascot-h) * -0.16) 0 calc(var(--mascot-h) * -0.22);
    pointer-events:none;
  }
  /* 장면 아래쪽(발끝 아래, 원본 y≈431 이하)을 부드럽게 지워, 변신 때 흩어지는 반짝이가
     로고 글자 뒤에서 잔해처럼 잘려 보이지 않게 함. 뛰는 토끼의 발(y≈429)은 남는 위치. */
  .intro-stage canvas{
    position:absolute; top:0; height:100%; display:block; z-index:1;
    transform-origin:50% 49%;
    -webkit-mask-image:linear-gradient(to bottom, #000 85%, transparent 89%);
            mask-image:linear-gradient(to bottom, #000 85%, transparent 89%);
  }
  .intro-stage noscript img{ display:block; margin:0 auto; height:var(--mascot-h); width:auto; }

  /* 변신이 끝나면: 은은한 광채 + 방울 + 둥실둥실 */
  .intro-glow, .intro-bubble{ position:absolute; opacity:0; transition:opacity 1.4s ease; pointer-events:none; }
  .intro-glow{
    left:50%; top:49%; width:calc(var(--mascot-h) * 1.25); height:calc(var(--mascot-h) * 1.25);
    transform:translate(-50%,-50%); border-radius:50%;
    background:radial-gradient(circle at 50% 50%, rgba(45,212,191,.26), rgba(45,212,191,0) 68%);
    filter:blur(6px);
  }
  .intro-bubble{ border-radius:50%; z-index:2; }
  .intro-bubble.b1{ left:calc(50% + var(--mascot-h) * .36); top:22%; width:14px; height:14px; background:#2DD4BF; }
  .intro-bubble.b2{ left:calc(50% - var(--mascot-h) * .46); top:62%; width:9px; height:9px; background:#F4623A; }
  .intro-stage.is-done .intro-glow{ opacity:1; }
  .intro-stage.is-done .intro-bubble.b1{ opacity:.85; animation:lab-bubble 3.4s ease-in-out infinite; }
  .intro-stage.is-done .intro-bubble.b2{ opacity:.7; animation:lab-bubble 2.6s ease-in-out .6s infinite; }
  .intro-stage.is-done canvas{ animation:intro-float 6s ease-in-out .4s infinite; }
  @keyframes intro-float{
    0%,100%{ transform:translateY(0) rotate(0); }
    25%{ transform:translateY(-6px) rotate(-1deg); }
    50%{ transform:translateY(-12px) rotate(0); }
    75%{ transform:translateY(-6px) rotate(1deg); }
  }
  .bubble{ position:absolute; border-radius:50%; }
  .bubble-1{ top:18px; right:-18px; width:14px; height:14px; background:#2DD4BF; opacity:.85;
    animation:lab-bubble 3.4s ease-in-out infinite; }
  .bubble-2{ bottom:40px; left:-24px; width:9px; height:9px; background:#F4623A; opacity:.7;
    animation:lab-bubble 2.6s ease-in-out .6s infinite; }

  .wordmark{
    margin:0; font-family:'Sora',sans-serif; font-weight:800;
    font-size:clamp(54px,10.5vw,150px); line-height:.92;
    letter-spacing:-.035em; color:#1E2A32;
  }
  .wordmark .dot{
    background:linear-gradient(120deg,#16B3A6,#0E9E94);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:#0E9E94;
  }
  .tagline{
    margin:0; font-size:clamp(16px,2.2vh,22px); font-weight:500;
    color:#5A6B72; max-width:680px; line-height:1.5;
  }
  .tagline b{ color:#0E9E94; font-weight:700; }
  .cta-row{
    display:flex; align-items:center; gap:12px;
    margin-top:clamp(4px,1.2vh,12px); flex-wrap:wrap; justify-content:center;
  }
  .cta{
    display:inline-flex; align-items:center; gap:8px;
    padding:15px 30px; border-radius:999px;
    background:linear-gradient(135deg,#F4623A,#E24E2A);
    color:#FFF; font-size:16px; font-weight:700; text-decoration:none;
    box-shadow:0 10px 22px rgba(244,98,58,.30);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .cta:hover, .cta:focus-visible{
    transform:translateY(-2px); box-shadow:0 14px 28px rgba(244,98,58,.38); outline:none;
  }
  .cta-secondary{
    display:inline-flex; align-items:center; gap:8px;
    padding:15px 30px; border-radius:999px;
    background:linear-gradient(135deg,#2DD4BF,#0E9E94);
    color:#FFF; font-size:16px; font-weight:700; text-decoration:none;
    box-shadow:0 10px 22px rgba(14,158,148,.30);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .cta-secondary:hover, .cta-secondary:focus-visible{
    transform:translateY(-2px); box-shadow:0 14px 28px rgba(14,158,148,.38); outline:none;
  }

  /* ===== FOOTER ===== */
  footer{
    position:relative; z-index:2;
    margin-top:auto; padding-top:12px;

  /* ===== LEGAL MODAL ===== */
  .legal-overlay{

    background:rgba(20,32,38,.42); backdrop-filter:blur(2px);
  }
  .legal-overlay.is-open{ display:flex; }
  .legal-card{
    position:relative; width:min(720px,100%); max-height:84vh;
    display:flex; flex-direction:column;
    background:#FBF8F1; border-radius:20px;
    box-shadow:0 30px 70px rgba(14,30,28,.32);
    overflow:hidden;
  }
  .legal-head{
    flex:none; padding:24px 28px 16px;
    border-bottom:1px solid rgba(30,42,50,.08);
    background:linear-gradient(180deg,#ECFBF6,rgba(236,251,246,0));
  }
  .legal-head h2{ margin:0; font-family:'Sora',sans-serif; font-size:22px; font-weight:800; color:#1E2A32; }
  .legal-head .eff{ margin:6px 0 0; font-size:12.5px; color:#7A8A8F; font-weight:500; }
  .legal-close{
    position:absolute; top:18px; right:18px;
    width:34px; height:34px; border-radius:50%;
    background:#FFFFFF; border:1px solid #E4EBE9; cursor:pointer;
    font-size:18px; line-height:1; color:#5A6B72;
    display:flex; align-items:center; justify-content:center;
    transition:all .15s ease;
  }
  .legal-close:hover{ background:#0E9E94; color:#FFF; border-color:#0E9E94; }
  .legal-body{
    flex:1; overflow-y:auto; padding:20px 28px 28px;
    font-size:14px; line-height:1.72; color:#46555C; text-wrap:pretty;
  }
  .legal-body h3{ margin:20px 0 6px; font-size:15px; font-weight:700; color:#1E2A32; }
  .legal-body h3:first-child{ margin-top:0; }
  .legal-body p{ margin:0 0 4px; }
  .legal-body ul{ margin:4px 0 4px; padding-left:18px; }
  .legal-body li{ margin:2px 0; }
  .legal-body .intro{ color:#5A6B72; }

  @keyframes lab-float { 0%,100%{ transform:translateY(0) rotate(-1.2deg);} 50%{ transform:translateY(-12px) rotate(1.2deg);} }
  @keyframes lab-bubble { 0%,100%{ transform:translateY(0); opacity:.5;} 50%{ transform:translateY(-8px); opacity:1;} }

  /* Free up the right-hand spacer earlier so the single-row nav fits on laptops. */
  @media (max-width:1180px){
    .nav-spacer{ display:none; }
  }

  /* ===== TABLET ===== */
  @media (max-width:900px){
    .logo{ width:72px; height:72px; }
  }

  /* ===== MOBILE ===== */
  @media (max-width:640px){
    .page{ padding:20px 18px 24px; overflow-y:auto; overflow-x:clip; }
    header{ flex-direction:column; gap:14px; }
    .logo{ width:84px; height:84px; }
    nav{ gap:8px; }
    .tab{ padding:11px 18px; font-size:14px; }
    .m-wave{ height:138px; }
    .intro-stage{ --mascot-h:138px; }
    .wordmark{ font-size:clamp(44px,15vw,76px); }
    .tagline{ font-size:15px; padding:0 6px; }
    .cta{ font-size:15px; padding:14px 24px; }
  }
  @media (max-width:380px){
    .m-wave{ height:118px; }
    .intro-stage{ --mascot-h:118px; }
    .wordmark{ font-size:42px; }
  }
  @media (prefers-reduced-motion:reduce){
    .mascots,.bubble-1,.bubble-2{ animation:none; }
    .intro-stage.is-done canvas, .intro-stage.is-done .intro-bubble{ animation:none; }
  }
</style>

<script>
  function openLegal(which){ location.href = which === 'privacy' ? 'privacy.html' : 'terms.html'; }
  function closeLegal(){}
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ closeLegal(); closeMenu(); } });

  function openMenu(key){
    var menu = NAV_MENUS[key];
    if (!menu) return;
    document.getElementById('menu-modal-title').textContent = menu.title;
    var list = document.getElementById('menu-modal-list');
    list.replaceChildren();
    menu.items.forEach(function(it){
      var row;
      if (it.soon){
        row = document.createElement('div');
        row.className = 'menu-choice soon';
        row.innerHTML = '<span class="mc-name"></span><span class="mc-note">준비중</span>';
        row.querySelector('.mc-name').textContent = it.name;
      } else {
        row = document.createElement('a');
        row.className = 'menu-choice';
        row.href = it.href;
        row.innerHTML = '<span class="mc-name"></span>' +
          (it.note ? '<span class="mc-note"></span>' : '') + '<span class="mc-go">→</span>';
        row.querySelector('.mc-name').textContent = it.name;
        if (it.note) row.querySelector('.mc-note').textContent = it.note;
      }
      list.append(row);
    });
    document.getElementById('menu-modal').classList.add('is-open');
    document.body.style.overflow = 'hidden';
  }
  // ===== 등장 애니메이션 =====
  // 원본 GIF(1440×520, 82프레임)에서 21~81번 프레임만 잘라 assets/rabbit-intro.webp 한 장에 모았다.
  // 원본에서 토끼는 20프레임마다 같은 동작으로 297px 전진하므로, 화면 폭에 맞춰 그 한 바퀴(앞 20프레임)를
  // 필요한 만큼 더 반복해 화면 오른쪽 바깥에서 출발시키고, 나머지(41~81번)는 원본 그대로 가운데에서 변신한다.
  // 행: [아틀라스 x, y, 폭, 높이, 장면 가운데로부터의 x, 장면 위(원본 y=70)로부터의 y, 표시 시간 ms]
  (function(){
    var FR = [[0,0,241,202,400,87,40],[243,0,185,167,404,112,50],[430,0,185,167,379,106,40],[617,0,185,167,355,106,40],[804,0,199,193,324,86,40],[1005,0,199,193,300,97,40],[1206,0,197,201,276,106,40],[1405,0,197,201,252,129,40],[1604,0,227,187,213,173,50],[0,204,227,187,207,173,40],[229,204,196,184,216,176,40],[427,204,196,184,210,176,40],[625,204,201,172,202,188,40],[828,204,201,172,196,188,50],[1031,204,193,179,200,181,40],[1226,204,190,206,202,154,160],[1418,204,202,184,195,176,90],[1622,204,217,221,188,139,40],[0,427,241,210,152,120,40],[243,427,241,202,127,105,40],[486,427,241,202,103,87,40],[729,427,185,167,107,112,50],[916,427,185,167,83,106,40],[1103,427,185,167,59,106,40],[1290,427,199,193,27,86,40],[1491,427,199,193,3,97,40],[1692,427,197,201,-20,106,40],[0,639,197,201,-45,129,40],[199,639,227,187,-84,173,50],[428,639,227,187,-90,173,40],[657,639,196,184,-81,176,40],[855,639,196,184,-87,176,40],[1053,639,201,172,-95,188,40],[1256,639,201,172,-100,188,50],[1459,639,193,179,-96,181,40],[1654,639,190,206,-95,154,80],[1846,639,202,184,-102,176,40],[0,847,210,176,-106,184,40],[212,847,219,169,-110,191,40],[433,847,266,242,-133,118,50],[701,847,528,330,-264,36,40],[1231,847,631,394,-315,4,40],[0,1243,631,394,-315,4,40],[633,1243,390,293,-195,53,40],[1025,1243,448,295,-224,44,50],[1475,1243,477,317,-236,35,40],[0,1639,517,334,-255,29,40],[519,1639,552,349,-271,24,40],[1073,1639,583,361,-285,21,40],[0,2002,610,372,-298,21,40],[612,2002,635,381,-311,23,40],[1249,2002,612,387,-323,25,50],[0,2391,629,396,-332,24,40],[631,2391,608,370,-335,23,40],[1241,2391,188,292,-94,51,40],[1431,2391,188,292,-94,61,40],[1621,2391,192,286,-96,69,50],[1815,2391,194,282,-97,73,80],[0,2789,191,286,-95,69,40],[193,2789,189,290,-95,65,40],[384,2789,188,292,-94,63,1460]];
    var CYCLE = 20, STEP = 297, SCENE_H = 425;
    var stage = document.getElementById('intro-stage');
    var canvas = document.getElementById('intro-canvas');
    if (!stage || !canvas || !canvas.getContext) return;
    var ctx = canvas.getContext('2d');
    var atlas = new Image();
    var cw = 0, s = 1, seq = [], pos = 0, done = false;

    function layout(){
      var rect = stage.getBoundingClientRect();
      var dpr = window.devicePixelRatio || 1;
      cw = document.documentElement.clientWidth;
      s = rect.height / SCENE_H;
      canvas.style.left = (-rect.left) + 'px';
      canvas.style.width = cw + 'px';
      canvas.width = Math.round(cw * dpr);
      canvas.height = Math.round(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.imageSmoothingQuality = 'high';
    }
    function draw(step){
      var f = FR[step[0]];
      ctx.clearRect(0, 0, cw, canvas.height);
      ctx.drawImage(atlas, f[0], f[1], f[2], f[3], cw / 2 + (f[4] + step[1]) * s, f[5] * s, f[2] * s, f[3] * s);
    }
    function build(){
      // 첫 프레임의 토끼 왼쪽 끝이 화면 오른쪽 끝보다 더 오른쪽에 있도록 반복 횟수를 정한다.
      var need = (cw / 2) / s + 12 - FR[0][4];
      var extra = Math.max(0, Math.ceil(need / STEP));
      seq = [];
      for (var c = extra; c >= 0; c--) for (var i = 0; i < CYCLE; i++) seq.push([i, STEP * c]);
      for (var j = CYCLE; j < FR.length; j++) seq.push([j, 0]);
    }
    function tick(){
      draw(seq[pos]);
      if (pos === seq.length - 1) { done = true; stage.classList.add('is-done'); return; }
      var wait = FR[seq[pos][0]][6];
      pos++;
      setTimeout(tick, wait);
    }
    atlas.onload = function(){
      layout(); build();
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        pos = seq.length - 1; tick(); return;
      }
      setTimeout(tick, 300);
    };
    atlas.src = 'assets/rabbit-intro.webp';
    window.addEventListener('resize', function(){
      if (!atlas.complete || !seq.length) return;
      layout();
      draw(done ? seq[seq.length - 1] : seq[Math.max(0, pos - 1)]);
    });
  })();

  function closeMenu(){
    document.getElementById('menu-modal').classList.remove('is-open');
    document.body.style.overflow = '';
  }
</script>
